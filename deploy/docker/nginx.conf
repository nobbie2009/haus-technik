worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_tokens off;
        root /app/www;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        location = /api/home-technik-update {
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 '{"supported":false,"state":"external","message":"Updates werden über die Unraid-Containerverwaltung installiert. Siehe Installationsanleitung."}';
        }
        location ^~ /api/home-technik-projects {
            client_max_body_size 24m;
            proxy_pass http://127.0.0.1:9088;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control no-cache;
        }
    }
}
