# Dedicated Home-Technik LXC; include through Debian sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/home-technik/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Debian versions differ in their default mapping for ES-module workers.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    # Retain hashed assets across releases for tabs that were already open.
    location ^~ /assets/ {
        root /var/www/home-technik;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
