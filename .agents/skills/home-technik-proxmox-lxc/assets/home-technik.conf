# Dedicated Home-Technik LXC; include through Debian sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/home-technik/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Debian versions differ in their default mapping for ES-module workers.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    location = /api/home-technik-update {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:9087;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Retain hashed assets across releases for tabs that were already open.
    location ^~ /assets/ {
        root /var/www/home-technik;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
